name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, types, unit + integration tests
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 10s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dig
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bind9-dnsutils
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check
      - name: Ruff format
        run: ruff format --check
      - name: Mypy
        run: mypy
      - name: Tests (unit + integration)
        run: pytest -m "not live" --cov --cov-report=term-missing

  docker:
    name: Docker image and doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker compose build cli
      - name: Doctor (starts Neo4j and waits for it)
        run: docker compose run --rm cli doctor
