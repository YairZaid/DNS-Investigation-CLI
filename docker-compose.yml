services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-dnsinv-local}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # browser UI: http://localhost:7474
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # The tool itself. `docker compose run --rm cli <command>` starts Neo4j
  # first and waits until its healthcheck passes.
  cli:
    build:
      context: .
      target: runtime
    image: dnsinv:latest
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dnsinv-local}
    volumes:
      - ./:/work:ro

  # Development only. Integration tests wipe the database they use, so they get their
  # own throwaway Neo4j (no volume, no ports) and never touch the graph `cli` reads.
  neo4j-test:
    profiles: ["dev"]
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/test-password
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p test-password 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # `docker compose --profile dev run --rm test` (unit + integration).
  test:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    image: dnsinv:dev
    depends_on:
      neo4j-test:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j-test:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: test-password
    volumes:
      - ./:/app
    command: ["pytest", "-m", "not live", "--cov", "--cov-report=term-missing"]

volumes:
  neo4j-data:
